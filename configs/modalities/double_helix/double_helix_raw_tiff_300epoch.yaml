    photon_mean_sigma: [20000.0, 1000.0]
    photon_range: [0.0, 31000.0]
    photon_scale: 31000.0
    z_range: [-1.5, 1.5]
    z_scale: 1.5
    pxyz_target_order: v03
    pixel_size_nm_x: 207.0
    pixel_size_nm_y: 207.0
    wavelength_nm: 660.0
    NA: 1.27
    refmed: 1.33
    refcov: 1.33
    refimm: 1.33
    npupil: 128
    vector_psf_size: 21
    vector_batch_size: 1024
    zemit0: 0.0
    lut_simulation:
      field_stride: 16
      z_steps: 101
      subpixel_bins: 1
      field_mode: global_field
      storage_dtype: fp16
    field_origin_sampling_mode: sliding_window
    field_origin_stride_px: 88
    conditioning_mode: channels
    condition_feature_dim: 0
    condition_dim: 0
    domain_count: 1
    append_domain_onehot: false
    dual_domain_coeff_maps:
      - name: double_helix
        coeff_maps_npz: /home/guest/Others/main/race/unity/output/unitypsf/dh_physical_update_100_gain0p03_psf21_bead01/physical_update/run/artifacts/roi_bank_gamma/latest/feedback/double_helix/coeff_maps.npz
