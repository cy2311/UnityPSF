schema_version: "unitypsf.instance_training.v1"

metadata:
  formal_training_contract: unitypsf.formal.v1

train:
  device: cuda
  epochs: 300
  batch_size: 24
  channel_layout:
    frame_size: [96, 96]
    channels:
      - id: main
        crop: [0, 0, 96, 96]
  expert:
    name: double_helix
    expert_type: double_helix
  model:
    name: double_helix_expert
    params:
      in_channels: 3
      feature_channels: 32
  loss:
    name: dh_direct_xyz_loss
    params:
      auxiliary_weight: 0.25
  optimizer:
    name: adamw
    params:
      lr: 0.0006
      weight_decay: 0.1
  online_generation:
    steps_per_epoch: 417
    batch_strategy: cached_window
    simulation_backend: lut
