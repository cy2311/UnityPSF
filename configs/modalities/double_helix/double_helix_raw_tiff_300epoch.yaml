schema_version: "unitypsf.instance_training.v1"

metadata:
  formal_training_contract: unitypsf.formal.v1

train:
  device: cuda
  epochs: 300
  batch_size: 24
  channel_layout:
    frame_size: [96, 96]
    channels:
      - id: main
        crop: [0, 0, 96, 96]
  expert:
    name: double_helix
    expert_type: double_helix
  model:
    name: active_smlm_soft_moe_double_unet
  loss:
    name: active_smlm_gmm_loss
    params:
      target_order: v03
      photon_scale: 31000.0
      z_scale: 1.5
  optimizer:
    name: adamw
    params:
      lr: 0.0006
      weight_decay: 0.1
  scaling:
    input_offset: 0.0
    input_scale: 1.0
    photon_max: 31000.0
    z_max: 1.5
    bg_max: 240.0
  online_generation:
    steps_per_epoch: 417
    batch_strategy: cached_window
    sequence_count: 16
    sequence_window_chunks: 2
    cached_window_order: auto
    cached_window_max_gpu_sequences: 1
    simulation_backend: cuda_gemm
    camera_readout: true
    simulation_output_device: renderer
    psf_type: vector
    height: 96
    width: 96
    channels: 3
    emitter_density_um2: 0.2
    background_range: [110.0, 110.0]
    photon_mean_sigma: [20000.0, 1000.0]
    photon_range: [0.0, 31000.0]
    photon_scale: 31000.0
    z_range: [-1.5, 1.5]
    z_scale: 1.5
    pxyz_target_order: v03
    pixel_size_nm_x: 207.0
    pixel_size_nm_y: 207.0
    wavelength_nm: 660.0
    NA: 1.27
    refmed: 1.33
    refcov: 1.33
    refimm: 1.33
    npupil: 128
    vector_psf_size: 21
    vector_batch_size: 1024
    zemit0: 0.0
    nat_simulation_mode: grid_map
    nat_grid_size: [2, 2]
    nat_grid_z_steps: 101
    field_origin_sampling_mode: sliding_window
    field_origin_stride_px: 88
    conditioning_mode: film
    expert_mode: soft_moe
    condition_feature_dim: 13
    condition_dim: 14
    domain_count: 1
    append_domain_onehot: true
    dual_domain_coeff_maps:
      - name: double_helix
        coeff_maps_npz: project://.local/formal-inputs/double_helix_map.npz
    pupil_carrier_complex_npz: project://.local/formal-inputs/double_helix_pupil.npz
    grad_clip_norm: 0.03
    amp_enabled: true
    amp_dtype: float16

smlm_overrides:
  lr_scheduler: StepLR
  lr_step_size: 10
  lr_gamma: 0.9
  lr_step_unit: epoch

localization_overrides:
  depth_shared: 2
  depth_union: 2
  nfeatures_init: 48
  nfeatures_inter: null
  norm_start_level: -1
  norm_groups: 0
  activation: ELU
  dropout_start_level: null
  p_dropout: -0.1
  pool_mode: StrideConv
  upsample_mode: nearest
  inter_activation: null
  norm_head_groups: 0
  final_activation: ELU
  kaiming_normal: true
  depthwise: true
