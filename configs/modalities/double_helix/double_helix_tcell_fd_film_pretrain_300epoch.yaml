schema_version: "unitypsf.instance_training.v1"

metadata:
  formal_training_contract: unitypsf.tcell_fd_dh_pretrain.v1
  physical_system: tcell_dh
  purpose: 13-dimensional FiLM pretraining before ZEISS-specific bead calibration

train:
  device: cuda
  epochs: 300
  batch_size: 24
  channel_layout:
    frame_size: [96, 96]
    channels:
      - id: main
        crop: [0, 0, 96, 96]
  expert:
    name: double_helix
    expert_type: double_helix
    channel_id: main
  model:
    name: double_helix_expert
    params:
      in_channels: 3
      feature_channels: 32
      condition_dim: 13
      domain_count: 1
      film_hidden_dim: 32
  loss:
    name: dh_direct_xyz_loss
    params:
      auxiliary_weight: 0.25
  optimizer:
    name: adamw
    params:
      lr: 0.0006
      weight_decay: 0.1
  online_generation:
    steps_per_epoch: 417
    batch_strategy: cached_window
    simulation_backend: cuda_gemm
    camera_readout: true
    simulation_output_device: renderer
    psf_type: vector
    height: 96
    width: 96
    channels: 3
    emitter_density_um2: 0.05
    background_range: [110.0, 110.0]
    photon_mean_sigma: [20000.0, 1000.0]
    photon_range: [0.0, 31000.0]
    photon_scale: 31000.0
    z_range: [-1.5, 1.5]
    z_scale: 1.5
    pxyz_target_order: v03
    pixel_size_nm_x: 207.0
    pixel_size_nm_y: 207.0
    wavelength_nm: 660.0
    NA: 1.27
    refmed: 1.33
    refcov: 1.33
    refimm: 1.33
    npupil: 128
    vector_psf_size: 21
    vector_batch_size: 1024
    zemit0: 0.0
    field_origin_sampling_mode: sliding_window
    field_origin_stride_px: 88
    conditioning_mode: film
    condition_feature_dim: 13
    condition_dim: 13
    domain_count: 1
    append_domain_onehot: false
    domain_balance_mode: fixed
    dual_domain_coeff_maps:
      - name: main
        coeff_maps_npz: /home/guest/Others/main/race/output/double_helix/calibration/tcell_dh_bead01_only_simulation_lowmem_retry_20260817/simulation96/arrays/residual21_zero_defocus_zernike_maps_nm.npz
    pupil_carrier_complex_npz: /home/guest/Others/main/race/output/double_helix/calibration/tcell_dh_bead_phase_refresh_20260817/independent_pixel_pupils/arrays/bead_01_complex_pupil.npz
    grad_clip_norm: 0.03
    amp_enabled: true
    amp_dtype: float16
  eval:
    enabled: true
    source: online_generation
    seed: 100000
    batch_count: 4
    batch_size: 4
    detection_threshold: 0.5
    dist_tol_xy_nm: 250.0
    dist_tol_z_nm: 500.0
  real_tiff_wake:
    enabled: false
  peak_zmap_bootstrap:
    enabled: false
  roi_bank_gamma:
    enabled: false

smlm_overrides:
  lr_scheduler: StepLR
  lr_step_size: 10
  lr_gamma: 0.9
  lr_step_unit: epoch
