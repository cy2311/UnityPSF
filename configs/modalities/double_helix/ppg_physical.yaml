schema_version: "unitypsf.instance_training.v1"
metadata:
  formal_training_contract: unitypsf.formal.v1
  ppg_artifact_schema: ppg.pca_map.v1
  ppg_parameterization: gamma36
train:
  device: cuda
  epochs: 300
  batch_size: 24
  channel_layout:
    frame_size: [96, 96]
    channels: [{id: main, crop: [0, 0, 96, 96]}]
  expert: {name: double_helix, expert_type: double_helix}
  model:
    name: double_helix_expert
    params:
      nch_in: 3
      depth_shared: 2
      depth_union: 2
      nfeatures_init: 48
      nfeatures_inter: null
      norm_start_level: -1
      norm_groups: 0
      activation: ELU
      dropout_start_level: null
      p_dropout: -0.1
      pool_mode: StrideConv
      upsample_mode: nearest
      inter_activation: ELU
      norm_head_groups: 0
      final_activation: ELU
      kaiming_normal: true
      depthwise: true
      z_mu_activation: tanh
      input_normalization: lunar
      condition_fields: [field_x, field_y, ppg_pca_0, ppg_pca_1, ppg_pca_2, ppg_pca_3]
      condition_dim: 6
      film_hidden_dim: 32
  loss:
    name: active_smlm_gmm_loss
    params:
      photon_scale: 31000.0
      z_scale: 0.6
      gmm_target_chunk: 4
      gmm_component_chunk: 64
      gmm_backend: mixture_same_family
      target_order: legacy_iwae
  optimizer:
    name: adamw
    params: {lr: 0.0006, weight_decay: 0.1}
  scaling: {photon_max: 31000.0, z_max: 0.6, bg_max: 240.0}
  online_generation:
    steps_per_epoch: 417
    batch_strategy: cached_window
    simulation_backend: ppg_direct
    simulation_output_device: renderer
    psf_type: ppg_direct
    height: 96
    width: 96
    channels: 3
    emitter_density_um2: 0.2
    background_range: [110.0, 110.0]
    photon_mean_sigma: [20000.0, 1000.0]
    photon_range: [0.0, 31000.0]
    photon_scale: 31000.0
    z_range: [-0.6, 0.6]
    z_scale: 0.6
    pxyz_target_order: legacy_iwae
    pixel_size_nm_x: 125.211897
    pixel_size_nm_y: 125.211897
    vector_psf_size: 21
    field_origin_sampling_mode: sliding_window
    field_origin_stride_px: 88
    conditioning_mode: film
    condition_feature_dim: 6
    condition_dim: 6
    ppg_map_path: project://configs/calibration/ppg/ppg_map_initial.npz
    grad_clip_norm: 0.03
    amp_enabled: true
    amp_dtype: float16
  eval:
    enabled: true
    source: online_generation
    seed: 104311
    batch_count: 4
    batch_size: 8
    match_dims: 3
    dist_tol_xy_nm: 250.0
    dist_tol_z_nm: 500.0
  ppg_physical_update:
    sample_tiff: /home/guest/Others/main/race/datasets/training_sets/Zeiss_2/microtubule_2026_08_20__17_02_49_2x_binmean.tif
    start_epoch: 30
    interval: 10
    frame_search_range: [100, 1000]
    frame_block_size: 16
    frame_block_count: 6
    grid_shape: [8, 8]
    roi_library_max_rois: 256
    roi_update_max_rois: 256
    min_occupied_grid_cells: 16
    roi_size_px: 96
    psf_support_px: 21
    background_estimation:
      method: lunar_gaussian_dark_pixels
      percentile: 10.0
      max_size_gb: 2.0
      chunk_frames: 64
      camera_backward: identity
    probability_threshold: 0.3
    fit_steps: 60
    learning_rate: 0.03
    regularization: 0.001
    gamma_ridge: 0.01
    gamma_boundary_anchor_strength: 1.0
    gamma_max_abs_delta: 0.05
    ncc_threshold: 0.75
    heldout_fraction: 0.2
    heldout_min_nll_improvement: 0.0
    heldout_min_improved_fraction: 0.5
    over_cut_px: 8
smlm_overrides: {lr_scheduler: StepLR, lr_step_size: 10, lr_gamma: 0.9, lr_step_unit: epoch}
