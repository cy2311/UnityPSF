[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-psf"
version = "0.4.0"
description = "UnityPSF v0.4 multimodal SMLM localization research package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy",
  "torch",
  "h5py",
  "tifffile",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
unity-psf-materialize-config = "unity_psf.config.materialize:main"
unity-psf-gamma-update-monitor = "unity_psf.diagnostics.gamma_update_monitor:main"
unity-psf-train-localization = "unity_psf.training.run_localization:main"
unity-psf-train-high-fidelity = "unity_psf.training.run_high_fidelity:main"
unity-psf-train-multichannel = "unity_psf.cli.multichannel:main"
unity-psf-train-joint = "unity_psf.cli.train_joint:main"
unity-psf-train-modality-joint = "unity_psf.cli.train_modality_joint:main"
unity-psf-train-joint-expert-parallel = "unity_psf.cli.train_joint_expert_parallel:main"
unity-psf-checkpoint = "unity_psf.cli.joint_checkpoint:main"
unity-psf-calibrate-double-helix = "unity_psf.cli.double_helix:calibrate_double_helix"
unity-psf-evaluate-double-helix = "unity_psf.cli.double_helix:evaluate_double_helix"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neptune_v04*", "unity_psf*", "double_helix*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
